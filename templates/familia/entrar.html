{% extends 'familia/base.html' %}
{% block title %}Entrar | Quefazeres{% endblock %}
{% block content %}<section><h1>Entrar</h1>
{% if erro %}<p>{{ erro }}</p>{% endif %}
<form method="post">{% csrf_token %}
<label for="username">Usuário</label><input id="username" name="nome_usuario" autocomplete="username" required>
<label for="password">Senha</label><input id="password" type="password" name="senha" autocomplete="current-password" required>
<p><button type="submit">Entrar</button></p></form>
<p>Primeira vez? <a href="{% url 'cadastro' %}">Criar conta do responsável</a></p></section>{% endblock %}
